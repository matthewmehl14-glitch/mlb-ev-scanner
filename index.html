<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB +EV Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-cyan-400">MLB +EV Prop Scanner</h1>

        <!-- API Setup Section -->
        <div id="setup-panel" class="bg-gray-800 p-6 rounded-lg mb-6 border border-gray-700">
            <h2 class="text-xl mb-4">API Setup</h2>
            <input type="password" id="api-key-input" placeholder="Enter The Odds API Key" class="bg-gray-700 text-white px-4 py-2 rounded w-full md:w-1/2 focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <button onclick="saveApiKey()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded mt-4 md:mt-0 md:ml-2">Save Key & Start</button>
            <p class="text-xs text-gray-400 mt-2">Your key is saved locally in your browser. It is never uploaded to GitHub.</p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div class="flex items-center flex-wrap gap-2">
                    <button onclick="scanSlate()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded shadow-lg transition-transform transform hover:scale-105">
                        Scan Today's Slate
                    </button>
                    <button onclick="downloadLog()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded shadow-lg transition-transform transform hover:scale-105">
                        Export Sharp CSV
                    </button>
                    <button onclick="clearApiKey()" class="text-sm text-gray-400 underline hover:text-white ml-2">Change API Key</button>
                </div>
                <div id="status-text" class="text-gray-400 font-mono text-sm animate-pulse">Waiting to scan...</div>
            </div>

            <!-- Filter Buttons -->
            <div class="mb-6 flex gap-2 flex-wrap" id="filters">
                <button onclick="filterResults('all')" class="bg-cyan-600 px-3 py-1 rounded text-sm hover:bg-cyan-500 transition-colors" id="btn-all">All</button>
                <button onclick="filterResults('sharp_value')" class="bg-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-600 transition-colors text-green-400 font-semibold" id="btn-sharp_value">🔥 Sharp Value Only</button>
                <button onclick="filterResults('pitcher_outs')" class="bg-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-600 transition-colors" id="btn-pitcher_outs">Pitcher Outs</button>
            </div>

            <!-- Results Grid -->
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Cards injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Cache Buster v=6 -->
    <script src="app.js?v=7"></script>
</body>
</html>
